<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTI-GECEPERS Perfil</title>
    <link rel="stylesheet" href="../public/css/perfil.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">
          <div class="logo">
           <a href="../pages/index.html"><img src="../images/cep_logo.png" alt="Logo"></a>
         </div>
         <span class="brand-name">GCEPERS</span>
         <link rel="stylesheet" href="../public/css/perfil.css">
     </div>

      <nav class="nav-menu">
        <a href="../pages/index.html" class="nav-link">INÍCIO</a>
       <a href="../pages/avisos.html" class="nav-link">AVISOS</a>
       <a href="../pages/eventos.html" class="nav-link">EVENTOS</a>
          <a href="../pages/merenda.html" class="nav-link">MERENDA</a>
       <a href="../pages/perfil.html" class="nav-link active">PERFIL</a>
       </nav>

       <div class="nav-search">
        <div class="nav-right">
      <a href="../pages/login.html" class="btn-login-nav">LOGIN</a>
       <input type="text" placeholder="Pesquisar">
       <button type="button">&#128269</button>
       </div>
     </header>

 <div class="perfil-span">
  <span>PERFIL</span>
</div>

<div class="perfil-header">
  <h1>MEU PERFIL.</h1>
</div>

<section class="perfil-container">
  <div class="perfil-grid">

    <div class="card-usuario">
      <div class="avatar-box">
        <div class="avatar">JS</div>
      </div>
      <div class="usuario-info">
        <h2>Estudante</h2>
        <p class="curso">Desenvolvimento de Sistemas</p>
        <span class="badge-status">Matriculado • 1º Ano</span>
      </div>
    </div>

    <div class="card-detalhes">
      <h3>Informações Acadêmicas</h3>
      <div class="info-grupo">
        <div class="info-item">
          <span class="label">Turma</span>
          <span class="valor">1º DS</span>
        </div>
        <div class="info-item">
          <span class="label">Turno</span>
          <span class="valor">Manhã</span>
        </div>
        <div class="info-item">
          <span class="label">RM / Matrícula</span>
          <span class="valor">2026-8492</span>
        </div>
        <div class="info-item">
          <span class="label">Frequência Geral</span>
          <span class="valor destaque">96%</span>
        </div>
      </div>
    </div>

    <div class="card-acoes">
      <h3>Ações Rápidas</h3>
      <div class="botoes-grid">
        <button class="btn-perfil">
          <span></span> Carteirinha Digital
        </button>
        <button class="btn-perfil">
          <span></span> Boletim Escolar
        </button>
        <button class="btn-perfil">
          <span></span> Alterar Senha
        </button>
        <button class="btn-perfil btn-sair">
          <span></span> Sair da Conta
        </button>
      </div>
    </div>
  </div>
</section>

</body>
</html>
